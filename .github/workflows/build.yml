name: Build Docker Images

on:
  pull_request:
    branches: ["**"]

jobs:
  setup-env-vars:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.set-variable.outputs.VERSION }}
      DATE: ${{ steps.set-variable.outputs.DATE }}
      ARCHS: ${{ steps.set-variable.outputs.ARCHS }}
      BUILD_BASE: ${{ steps.set-variable.outputs.BUILD_BASE }}
      PUSH_IMAGES: ${{ steps.set-variable.outputs.PUSH_IMAGES }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set environment variables
        id: set-variable
        run: |
          VERSION=$(sed 's/.*"version": "\(.*\)".*/\1/;t;d' ./package.json)
          DATE=$(date +"%Y_%m_%dT%H_%M_%Sz")
          ARCHS=all-arch
          BUILD_BASE=true
          PUSH_IMAGES=false

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "ARCHS=$ARCHS" >> $GITHUB_OUTPUT
          echo "BUILD_BASE=$BUILD_BASE" >> $GITHUB_OUTPUT
          echo "PUSH_IMAGES=$PUSH_IMAGES" >> $GITHUB_OUTPUT

          echo VERSION=$VERSION
          echo DATE=$DATE
          echo ARCHS=$ARCHS
          echo BUILD_BASE=$BUILD_BASE
          echo PUSH_IMAGES=$PUSH_IMAGES

          git log -5
        shell: bash

  docker_linux_image_base:
    if: needs.setup-env-vars.outputs.BUILD_BASE == 'true'
    needs: [setup-env-vars]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    name: Build Docker base image (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Display runner resources
        run: |
          echo "CPU Cores: $(nproc)"
          echo "RAM:"
          free -h
          echo "Architecture: $(uname -m)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ needs.setup-env-vars.outputs.PUSH_IMAGES == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base
          tags: |
            type=raw,value=${{ needs.setup-env-vars.outputs.VERSION }}_${{ needs.setup-env-vars.outputs.DATE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./docker-build
          file: ./docker-build/docker/Dockerfile.base
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base,push-by-digest=${{ needs.setup-env-vars.outputs.PUSH_IMAGES == 'true' }},name-canonical=true,push=${{ needs.setup-env-vars.outputs.PUSH_IMAGES == 'true' }}

      - name: Export digest
        if: ${{ needs.setup-env-vars.outputs.PUSH_IMAGES == 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ needs.setup-env-vars.outputs.PUSH_IMAGES == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_linux_image_base_merge:
    if: needs.setup-env-vars.outputs.BUILD_BASE == 'true' && needs.setup-env-vars.outputs.PUSH_IMAGES == 'true'
    needs: [setup-env-vars, docker_linux_image_base]
    runs-on: ubuntu-latest
    name: Merge Docker base image manifests
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-base-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base:${{ needs.setup-env-vars.outputs.VERSION }}_${{ needs.setup-env-vars.outputs.DATE }} \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base:latest \
            $(printf '${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKER_HUB_USERNAME }}/tdarr_base:${{ needs.setup-env-vars.outputs.VERSION }}_${{ needs.setup-env-vars.outputs.DATE }}

  docker_linux_image_final:
   # if BUILD_BASE is false, workflow will still run without building the base image
    if: ${{ !cancelled() }}
    needs: [
      setup-env-vars,
      # BUILD_BASE
      docker_linux_image_base,
      docker_linux_image_base_merge,
      ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [node, be]
    name: Build Docker final images
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build ${{ matrix.component }} image
        working-directory: ./docker-build
        run: |
          make build-${{ matrix.component }}-${{needs.setup-env-vars.outputs.ARCHS}} TAG=dev DATE=${{needs.setup-env-vars.outputs.DATE}} BUILD_BASE=${{needs.setup-env-vars.outputs.BUILD_BASE}} PUSH_IMAGES=${{needs.setup-env-vars.outputs.PUSH_IMAGES}} PDIR=../ USE_PROD_PACKAGES=true
