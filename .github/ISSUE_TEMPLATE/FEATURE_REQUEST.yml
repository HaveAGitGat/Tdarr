name: Feature Request
description: Request a feature for this project.
title: "[Feature Request - "
labels: ["enhancement"]
type: feature-request
body:
  - type: markdown
    attributes:
      value: |
        "Please put plugin requests/bugs at: https://github.com/HaveAGitGat/Tdarr_Plugins"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "Is your feature request related to a problem? A clear and concise description of what the problem is."
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: "What solution are you proposing? A clear and concise description of what you want to happen."
      placeholder: "What I want to change/happen are..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Any alternatives?"
      description: "A clear and concise description of any alternative solutions or features you've considered."
      placeholder: "The alternatives I've considered are..."
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: "Add any other context about the feature request here."
      placeholder: 
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: "If applicable, add screenshots for additional context."
    validations:
      required: false
  - type: checkboxes
    id: agreements
    attributes:
      label: "I have verified the following:"
      description: I have verified that this feature request is not related to any other feature request or has not been requested before, and this feature request is not a plugin feature request.
      options:
        - label: This feature request is not related nor has been requested before
          required: true
        - label: This feature request is not a plugin feature request
          required: true
